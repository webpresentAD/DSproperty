<style>
:root{
  --ink:#111214; --ink-2:#1a1c1f; --paper:#efede8; --concrete:#d8d4cb; --stone:#9b968b;
  --accent:#b8955a; --accent-dark:#7d6234; --white:#fff;
  --display:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.19,.8,.22,1);
  --max:1280px; --gap:clamp(10px,1.4vw,18px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:68px;-webkit-text-size-adjust:100%}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.menu-open{overflow:hidden}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
ul,ol{list-style:none}
button{font:inherit;color:inherit}
.wrap{max-width:var(--max);margin:0 auto;padding:0 clamp(20px,4vw,48px)}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:#fff;padding:10px 16px;z-index:300}
.skip:focus{left:8px}

h2{font-family:var(--display);font-weight:800;font-size:clamp(2.3rem,6vw,5.2rem);line-height:.98;letter-spacing:-.035em}
h3{font-family:var(--display);font-weight:700;letter-spacing:-.015em;line-height:1.15}
.label{display:flex;align-items:center;gap:14px;font-size:.72rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;margin-bottom:28px;color:var(--accent-dark)}
.label span{font-family:var(--display);font-weight:800;color:inherit}
.label::after{content:"";width:56px;height:1px;background:currentColor;opacity:.7}
.dark .label,.on-dark .label{color:var(--accent)}
section{position:relative}

/* ============ HEADER ============ */
.hdr{position:fixed;inset:0 0 auto 0;z-index:100;color:#fff;border-bottom:1px solid transparent;transition:background .5s,border-color .5s;animation:hdrIn 1.1s .5s var(--ease) backwards}
.hdr.solid{background:rgba(17,18,20,.96);border-color:rgba(255,255,255,.08)}
@media(min-width:981px){
  .hdr.solid{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
}
@keyframes hdrIn{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.nav{display:flex;align-items:center;justify-content:space-between;height:78px;transition:height .4s}
.hdr.solid .nav{height:64px}
.nav-l{display:flex;align-items:center;gap:clamp(28px,4.5vw,64px)}
.logo{position:relative;z-index:2;text-decoration:none;font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:.92rem;line-height:1.1;white-space:nowrap}
.logo small{display:block;font-weight:500;letter-spacing:.5em;font-size:.55rem;color:var(--accent);margin-top:4px}
.menu ul{display:flex;gap:clamp(18px,2.4vw,34px)}
.menu a{position:relative;display:inline-block;text-decoration:none;font-size:.82rem;font-weight:500;letter-spacing:.06em;padding:6px 0;color:rgba(255,255,255,.88);transition:color .3s}
.menu a::after{content:"";position:absolute;left:0;bottom:2px;width:100%;height:1px;background:var(--accent);transform:scaleX(0);transform-origin:right;transition:transform .5s var(--ease)}
.menu a:hover{color:#fff}
.menu a:hover::after{transform:scaleX(1);transform-origin:left}
.tel{position:relative;z-index:2;display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-size:.82rem;font-weight:500;letter-spacing:.06em;color:rgba(255,255,255,.88);transition:color .3s}
.tel:hover{color:var(--accent)}
.tel svg{width:15px;height:15px}
.burger{position:relative;z-index:2;display:none;width:44px;height:44px;background:none;border:0;cursor:pointer;margin-left:-10px}
.burger span{position:absolute;left:10px;right:10px;height:2px;background:#fff;transition:transform .5s var(--ease),top .5s var(--ease)}
.burger span:nth-child(1){top:17px}.burger span:nth-child(2){top:25px}
body.menu-open .burger span:nth-child(1){top:21px;transform:rotate(45deg)}
body.menu-open .burger span:nth-child(2){top:21px;transform:rotate(-45deg)}
@media(max-width:980px){
  .burger{display:block}
  .tel span{display:none}
  .tel{width:44px;height:44px;justify-content:center}
  .tel svg{width:20px;height:20px}
  .nav-l{gap:6px}
  body.menu-open .hdr{background:var(--ink);border-color:transparent}
  .menu{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100vh;height:100dvh;background:#111214;visibility:hidden;opacity:0;transition:opacity .45s,visibility .45s;padding:110px clamp(20px,6vw,48px) 40px;display:flex;flex-direction:column;justify-content:center;overflow-y:auto;z-index:1}
  body.menu-open .menu{visibility:visible;opacity:1}
  .menu ul{flex-direction:column;gap:0}
  .menu li{overflow:hidden;border-bottom:1px solid rgba(255,255,255,.1)}
  .menu a{font-family:var(--display);font-weight:800;font-size:clamp(2rem,9vw,3.2rem);letter-spacing:-.02em;padding:14px 0;display:block;color:#fff;transform:translateY(100%);transition:transform .7s var(--ease)}
  .menu a::after{display:none}
  body.menu-open .menu a{transform:none}
  body.menu-open .menu li:nth-child(2) a{transition-delay:.05s}
  body.menu-open .menu li:nth-child(3) a{transition-delay:.1s}
  body.menu-open .menu li:nth-child(4) a{transition-delay:.15s}
  body.menu-open .menu li:nth-child(5) a{transition-delay:.2s}
  body.menu-open .menu li:nth-child(6) a{transition-delay:.25s}
}

/* ============ HERO ============ */
.hero{position:relative;min-height:100vh;min-height:100svh;background:var(--ink);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.hero-media{position:absolute;inset:0;overflow:hidden}
.hero-media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,18,20,.62) 0%,rgba(17,18,20,.12) 30%,rgba(17,18,20,.38) 62%,rgba(17,18,20,.9) 100%),linear-gradient(90deg,rgba(17,18,20,.5),transparent 70%)}
.hero-par{position:absolute;inset:-6% 0;will-change:transform}
.hero-par img{width:100%;height:100%;object-fit:cover}
.hero-in{position:relative;z-index:2;width:100%;padding-top:140px}
.hero-sub{font-size:.76rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:22px;display:flex;align-items:center;gap:14px}
.hero-sub::before{content:"";width:44px;height:1px;background:var(--accent)}
.hero h1{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(2.6rem,10.5vw,9.6rem);line-height:.92;letter-spacing:-.04em}
.ln{display:block;overflow:hidden;padding-bottom:.06em}
.ln span{display:block}
.hero-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;margin-top:clamp(28px,4vw,52px);padding-bottom:26px}
.hero-foot p{max-width:500px;color:rgba(255,255,255,.88);font-size:clamp(.98rem,1.3vw,1.12rem)}
.explore{display:inline-flex;align-items:center;gap:18px;text-decoration:none;font-weight:600;font-size:.95rem;letter-spacing:.04em;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.55);transition:border-color .4s,color .4s;white-space:nowrap}
.explore .arr{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border:1px solid rgba(255,255,255,.55);border-radius:50%;font-size:1.15rem;transition:background .4s,color .4s,border-color .4s,transform .5s var(--ease)}
.explore:hover{color:var(--accent);border-color:var(--accent)}
.explore:hover .arr{background:var(--accent);border-color:var(--accent);color:var(--ink);transform:translateY(5px)}
.hero-rail{position:relative;z-index:2;border-top:1px solid rgba(255,255,255,.22)}
.hero-rail .wrap{display:flex;justify-content:space-between;gap:20px;padding-top:16px;padding-bottom:18px;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.72)}
@media(max-width:760px){
  .hero-foot{flex-direction:column;align-items:flex-start}
  .hero-rail .wrap span:nth-child(3){display:none}
  .hero-rail .wrap{font-size:.62rem;letter-spacing:.12em}
}
@media(prefers-reduced-motion:no-preference){
  .hero-media{animation:mediaIn 1.9s var(--ease) both}
  @keyframes mediaIn{from{clip-path:inset(11% 7% 11% 7%)}to{clip-path:inset(0)}}
  .hero-par img{animation:imgIn 2.6s var(--ease) both}
  @keyframes imgIn{from{transform:scale(1.22)}to{transform:scale(1)}}
  .ln span{transform:translateY(112%);animation:lnUp 1.2s var(--ease) forwards}
  .ln:nth-child(1) span{animation-delay:.7s}
  .ln:nth-child(2) span{animation-delay:.85s}
  .hero-sub,.hero-foot,.hero-rail{opacity:0;animation:fadeUp 1.1s var(--ease) forwards}
  .hero-sub{animation-delay:.55s}
  .hero-foot{animation-delay:1.25s}
  .hero-rail{animation-delay:1.5s}
  @keyframes lnUp{to{transform:none}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
}

/* ============ REVEAL SYSTEM ============ */
@media(prefers-reduced-motion:no-preference){
  .js .rv{opacity:0;transform:translateY(34px);transition:opacity 1s var(--ease),transform 1s var(--ease);transition-delay:var(--d,0s)}
  .js .rv.in{opacity:1;transform:none}
  .js .pic{clip-path:inset(0 0 100% 0);transition:clip-path 1.4s var(--ease);transition-delay:var(--d,0s)}
  .js .pic img{transform:scale(1.14);transition:transform 1.8s var(--ease);transition-delay:var(--d,0s)}
  .js .pic.in{clip-path:inset(0)}
  .js .pic.in img{transform:scale(1)}
}
.pic{position:relative;display:block;width:100%;padding:0;border:0;background:#cfcac0;overflow:hidden;cursor:zoom-in}
.pic img{width:100%;height:100%;object-fit:cover}
.pic.in:hover img{transform:scale(1.03);transition:transform 1.1s var(--ease)}
.pic .pn{position:absolute;left:14px;bottom:12px;font-size:.66rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#fff;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s var(--ease);text-shadow:0 1px 8px rgba(0,0,0,.6)}
.pic::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 70%,rgba(17,18,20,.45));opacity:0;transition:opacity .5s}
.pic:hover .pn{opacity:1;transform:none}
.pic:hover::after{opacity:1}

/* ============ WORK (featured) ============ */
.work{padding:clamp(80px,12vw,170px) 0 clamp(70px,10vw,140px)}
.work-head{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gap);align-items:end;margin-bottom:clamp(40px,6vw,90px)}
.work-head
